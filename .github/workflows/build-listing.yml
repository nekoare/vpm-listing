name: Build Repo Listing

on:
  workflow_dispatch:
  push:
    branches: main
    paths: source.json

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-listing:
    name: build-listing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build package listing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p Website

          python3 << 'PYEOF'
          import json, subprocess, tempfile, zipfile, os

          with open("source.json") as f:
              source = json.load(f)

          # Fetch all packages from GitHub releases
          all_packages = {}
          repos = source.get("githubRepos", [])

          for repo in repos:
              print(f"Processing {repo}...")
              try:
                  result = subprocess.run(
                      ["gh", "api", f"repos/{repo}/releases", "--paginate"],
                      capture_output=True, text=True, check=True
                  )
                  releases = json.loads(result.stdout)
              except Exception as e:
                  print(f"  Warning: Could not fetch releases for {repo}: {e}")
                  continue

              for release in releases:
                  tag = release.get("tag_name", "")
                  version = tag.lstrip("v")
                  if not version:
                      continue

                  zip_asset = None
                  for asset in release.get("assets", []):
                      if asset["name"].endswith(".zip"):
                          zip_asset = asset
                          break

                  if not zip_asset:
                      print(f"  {tag}: no zip asset, skipping")
                      continue

                  download_url = zip_asset["browser_download_url"]

                  with tempfile.TemporaryDirectory() as tmpdir:
                      zip_path = os.path.join(tmpdir, "pkg.zip")
                      subprocess.run(
                          ["curl", "-sL", download_url, "-o", zip_path],
                          check=True
                      )
                      try:
                          with zipfile.ZipFile(zip_path, "r") as zf:
                              with zf.open("package.json") as pf:
                                  pkg = json.loads(pf.read())
                      except Exception as e:
                          print(f"  {tag}: could not extract package.json: {e}")
                          continue

                  pkg["url"] = download_url
                  pkg_name = pkg.get("name", "")

                  if pkg_name not in all_packages:
                      all_packages[pkg_name] = {"versions": {}}

                  all_packages[pkg_name]["versions"][version] = pkg
                  print(f"  {tag}: added {pkg_name} {version}")

          # Generate listing files for each listing definition
          for listing_key, listing_def in source.get("listings", {}).items():
              filtered = {}
              for pkg_name in listing_def.get("packages", []):
                  if pkg_name in all_packages:
                      filtered[pkg_name] = all_packages[pkg_name]

              output = {
                  "name": listing_def["name"],
                  "id": listing_def["id"],
                  "url": listing_def["url"],
                  "author": source["author"],
                  "packages": filtered
              }

              out_path = os.path.join("Website", listing_def["path"])
              os.makedirs(os.path.dirname(out_path), exist_ok=True)
              with open(out_path, "w") as f:
                  json.dump(output, f, indent=2, ensure_ascii=False)

              pkg_names = ", ".join(filtered.keys()) or "(none)"
              print(f"\n[{listing_key}] {out_path}: {len(filtered)} package(s) - {pkg_names}")

          print("\nDone!")
          PYEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
